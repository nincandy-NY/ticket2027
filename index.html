<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Year Party Invitation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>✨ New Year Party 2027 ✨</h1>
        
        <div class="input-section">
            <input type="text" id="userName" placeholder="พิมพ์ชื่อของคุณที่นี่..." maxlength="20">
            <div class="upload-btn-wrapper">
                <button class="btn">อัปโหลดสลิปยืนยัน</button>
                <input type="file" id="slipUpload" accept="image/*">
            </div>
            <p>คนละ200฿</p>
            <p class="payment-info">1763177099(กสิกรไทย)</p>
        </div>

        <div id="ticket" class="ticket-card">
            <div class="ticket-header">
                <p class="event-type">EXCLUSIVE ACCESS</p>
                <h2>HAPPY NEW YEAR</h2>
                <div class="year-badge">2027</div>
            </div>
            
            <div class="ticket-body">
                <div class="info">
                    <span class="label">GUEST NAME</span>
                    <h3 id="display-name">YOUR NAME</h3>
                </div>
                
                <div class="slip-container">
                    <span class="label">PAYMENT VERIFIED</span>
                    <div id="slip-preview" class="slip-placeholder">
                        <span id="placeholder-text">WAITING FOR SLIP...</span>
                    </div>
                </div>
            </div>

            <div class="ticket-footer">
                <div class="footer-item">
                    <span class="label">LOCATION</span>
                    <p>📍 nincandy's house</p>
                </div>
                <div class="footer-item">
                    <span class="label">DATE & TIME</span>
                    <p>31 DEC | 17:00 PM</p>
                </div>
            </div>
            
            <div class="cutout left"></div>
            <div class="cutout right"></div>
        </div>

        <button id="download-btn" class="save-btn">SAVE TICKET (PNG)</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js"></script>

  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

  authDomain: "dashbord-cc606.firebaseapp.com",
  projectId: "dashbord-cc606",
  storageBucket: "dashbord-cc606.firebasestorage.app",
  messagingSenderId: "585071110655",

  measurementId: "G-F69E8WMK51"

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Year Party Invitation 2027</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>✨ New Year Party 2027 ✨</h1>
        <div class="input-section">
            <input type="text" id="userName" placeholder="พิมพ์ชื่อของคุณที่นี่..." maxlength="20">
            <div class="upload-btn-wrapper">
                <button class="btn">อัปโหลดสลิปยืนยัน</button>
                <input type="file" id="slipUpload" accept="image/*">
            </div>
            <p>คนละ 200฿ | 1763177099 (กสิกรไทย)</p>
        </div>

        <div id="ticket" class="ticket-card">
            <div class="ticket-header">
                <h2>HAPPY NEW YEAR 2027</h2>
            </div>
            <div class="ticket-body">
                <span class="label">GUEST NAME</span>
                <h3 id="display-name">YOUR NAME</h3>
                <div id="slip-preview" class="slip-placeholder">
                    <span>WAITING FOR SLIP...</span>
                </div>
            </div>
        </div>
        <button id="download-btn" class="save-btn">SAVE TICKET & SEND INFO</button>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

      // Firebase Config ของคุณ
     const firebaseConfig = {
  apiKey: "AIzaSyD6_0Wr0fJdIo-C6cdfv5CVbMwA77bfFy0",
  authDomain: "dash-830b1.firebaseapp.com",
  projectId: "dash-830b1",
  storageBucket: "dash-830b1.firebasestorage.app",
  messagingSenderId: "184375273293",
  appId: "1:184375273293:web:1f43509635337535027904",
  measurementId: "G-3QKDF5ZZF1",
};

      // Initialize Firebase
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // ส่งตัวแปร db และ tools ไปที่ window เพื่อให้ script.js เรียกใช้งานได้
      window.fbUpload = { 
        db: db, 
        tools: { collection, addDoc } 
      };
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
